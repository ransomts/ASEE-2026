<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="darkreader-lock">
<title>STEM Curriculum Explorer</title>
<meta name="description" content="Interactive explorer for curricular overlap between STEM programs using the MIDFIELD dataset. ASEE 2026.">
<meta property="og:title" content="STEM Curriculum Explorer">
<meta property="og:description" content="Explore curricular overlap between STEM programs using the MIDFIELD dataset.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ransomts.github.io/ASEE-2026/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="STEM Curriculum Explorer">
<meta name="twitter:description" content="Interactive STEM curricular similarity explorer — ASEE 2026">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23F56600'/></svg>">
<style>
  :root {
    --clemson-orange: #F56600;
    --clemson-purple: #522D80;
    --bg: #fefefe;
    --text: #2d3436;
    --text-muted: #636e72;
    --surface: #f8f8f8;
    --border: #e0e0e0;
    --detail-bg: #f8f4fc;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* Header */
  #header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
    border-bottom: 3px solid var(--clemson-orange);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #header-title {
    flex: 1;
  }

  #header h1 {
    font-size: 20px;
    font-weight: 700;
    color: var(--clemson-purple);
  }

  .header-subtitle {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 400;
    margin-top: 2px;
  }

  .header-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .dot-orange { background: var(--clemson-orange); }
  .dot-purple { background: var(--clemson-purple); }

  /* Domain pills */
  #domain-bar {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    overflow-x: auto;
    border-bottom: 1px solid var(--border);
    -webkit-overflow-scrolling: touch;
  }

  #domain-bar::-webkit-scrollbar { display: none; }

  .domain-pill {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: 20px;
    border: 2px solid var(--clemson-purple);
    background: transparent;
    color: var(--clemson-purple);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .domain-pill.active {
    background: var(--clemson-purple);
    color: #fff;
  }

  /* Main content */
  #main {
    padding: 12px 8px;
    padding-bottom: 100px;
  }

  /* Active metric indicator */
  #metric-indicator {
    padding: 6px 16px;
    font-size: 13px;
    color: var(--text-muted);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  #metric-indicator-name {
    font-weight: 700;
    color: var(--clemson-orange);
  }

  /* Heatmap */
  #heatmap-container {
    overflow-x: auto;
    overflow-y: visible;
    -webkit-overflow-scrolling: touch;
    padding: 8px 12px;
  }

  #heatmap-wrapper {
    display: inline-block;
    min-width: min-content;
  }

  /* Color legend */
  #legend {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 8px 4px;
    font-size: 14px;
    color: var(--text-muted);
  }

  #legend-bar {
    flex: 1;
    height: 14px;
    border-radius: 6px;
    background: linear-gradient(to right, #fff, #ffb060, #F56600, #a03820, #522D80);
  }

  /* Detail panel */
  #detail-panel {
    display: none;
    position: fixed;
    bottom: 70px;
    left: 8px;
    right: 8px;
    max-height: 50vh;
    background: var(--detail-bg);
    border-radius: 12px 12px 0 0;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
    z-index: 200;
    overflow-y: auto;
    padding: 16px;
  }

  #detail-panel.visible {
    display: block;
    animation: slideUp 0.25s ease-out;
  }

  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  #detail-empty {
    text-align: center;
    color: var(--text-muted);
    padding: 20px 0;
    font-size: 14px;
    display: none;
  }

  #detail-close {
    position: absolute;
    top: 10px;
    right: 12px;
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--text-muted);
    line-height: 1;
    padding: 2px 6px;
  }

  #detail-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--clemson-purple);
    margin-bottom: 12px;
    padding-right: 30px;
  }

  .metric-bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .metric-bar-label {
    width: 90px;
    font-size: 13px;
    color: var(--text-muted);
    flex-shrink: 0;
    text-align: right;
  }

  .metric-bar-track {
    flex: 1;
    height: 14px;
    background: var(--border);
    border-radius: 7px;
    overflow: hidden;
  }

  .metric-bar-fill {
    height: 100%;
    border-radius: 7px;
    background: var(--clemson-purple);
    transition: width 0.3s ease;
  }

  .metric-bar-fill.highlighted { background: var(--clemson-orange); }

  .metric-bar-value {
    width: 42px;
    font-size: 13px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  #detail-classification {
    margin-top: 12px;
    padding: 10px 12px;
    background: #ede8f5;
    border-left: 4px solid var(--clemson-purple);
    border-radius: 0 6px 6px 0;
  }

  #detail-classification .class-label {
    font-size: 15px;
    font-weight: 700;
    color: var(--clemson-purple);
    margin-bottom: 2px;
  }

  #detail-classification .class-desc {
    font-size: 14px;
    color: var(--text);
    margin-bottom: 4px;
  }

  #detail-classification .class-note {
    font-size: 12px;
    color: var(--text-muted);
    font-style: italic;
  }

  /* Bottom drawer */
  #drawer-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 290;
  }

  #drawer-overlay.visible { display: block; }

  #drawer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg);
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.12);
    z-index: 300;
    max-height: 55vh;
    transform: translateY(calc(100% - 70px));
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
  }

  #drawer.expanded { transform: translateY(0); }

  #drawer-handle {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 16px 6px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  #drawer-handle-bar {
    width: 36px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 8px;
  }

  #drawer-handle-label {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  #drawer-content {
    flex: 1;
    overflow-y: auto;
    padding: 0 16px 16px;
  }

  .drawer-section-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-muted);
    margin: 10px 0 6px;
  }

  /* Metric chips */
  #metric-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .metric-chip {
    padding: 7px 14px;
    border-radius: 16px;
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .metric-chip.active {
    background: var(--clemson-orange);
    border-color: var(--clemson-orange);
    color: #fff;
  }

  /* Quick select buttons */
  #quick-select {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .quick-btn {
    padding: 7px 14px;
    border-radius: 16px;
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .quick-btn:hover { border-color: var(--clemson-purple); }

  /* Major toggles */
  #major-toggles {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .major-toggle {
    padding: 6px 12px;
    border-radius: 14px;
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .major-toggle.active {
    background: var(--clemson-purple);
    border-color: var(--clemson-purple);
    color: #fff;
  }

  /* Heatmap grid styles */
  .hm-grid {
    display: inline-grid;
    gap: 2px;
  }

  .hm-cell {
    aspect-ratio: 1;
    cursor: pointer;
    border-radius: 2px;
    transition: background-color 0.3s;
    -webkit-tap-highlight-color: transparent;
    position: relative;
  }

  .hm-cell:active { transform: scale(0.92); }

  .hm-cell:hover, .hm-cell.selected {
    outline: 2px solid var(--clemson-orange);
    outline-offset: 1px;
    z-index: 1;
  }

  .hm-col-label {
    font-weight: 600;
    color: var(--text-muted);
    line-height: 1.2;
    overflow: hidden;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    text-align: left;
    padding: 2px 0;
    white-space: pre-line;
  }

  .hm-row-label {
    font-weight: 600;
    color: var(--text-muted);
    text-align: right;
    padding-right: 6px;
    line-height: 1.2;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    overflow: hidden;
    word-break: break-word;
  }

  .hm-corner { /* empty top-left corner */ }

  /* Loading */
  #loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 14px;
    gap: 10px;
  }

  .spinner {
    width: 20px;
    height: 20px;
    border: 3px solid var(--border);
    border-top-color: var(--clemson-purple);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ══════════════════════════════════════════════════════════════════════════
     DARK MODE
     ══════════════════════════════════════════════════════════════════════════ */
  /* Dark theme (toggled via data-theme attribute) */
  [data-theme="dark"] {
    --bg: #1a1a2e;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --surface: #16213e;
    --border: #30363d;
    --detail-bg: #1e1533;
  }
  [data-theme="dark"] #header {
    background: #16213e;
    border-bottom-color: var(--clemson-orange);
  }
  [data-theme="dark"] .domain-pill {
    border-color: var(--clemson-purple);
    color: #ccc;
  }
  [data-theme="dark"] .domain-pill.active {
    color: #fff;
  }
  [data-theme="dark"] #metric-indicator {
    background: var(--surface);
    border-bottom-color: var(--border);
  }
  [data-theme="dark"] .metric-chip,
  [data-theme="dark"] .quick-btn,
  [data-theme="dark"] .major-toggle {
    background: var(--surface);
    border-color: var(--border);
    color: var(--text-muted);
  }
  [data-theme="dark"] #detail-panel {
    background: var(--detail-bg);
    box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
  }
  [data-theme="dark"] #drawer {
    background: var(--surface);
    box-shadow: 0 -4px 24px rgba(0,0,0,0.3);
  }
  [data-theme="dark"] .metric-bar-track {
    background: var(--border);
  }
  [data-theme="dark"] #detail-classification {
    background: #2a1f3d;
  }
  [data-theme="dark"] .header-subtitle {
    color: var(--text-muted);
  }

  /* Theme toggle */
  #theme-toggle {
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    line-height: 1;
    -webkit-tap-highlight-color: transparent;
  }
  #theme-toggle:hover {
    background: rgba(0,0,0,0.06);
  }
  [data-theme="dark"] #theme-toggle:hover {
    background: rgba(255,255,255,0.1);
  }

  /* ══════════════════════════════════════════════════════════════════════════
     DESKTOP LAYOUT (>= 768px): sidebar instead of drawer
     ══════════════════════════════════════════════════════════════════════════ */
  @media (min-width: 768px) {
    body {
      display: grid;
      grid-template-columns: 1fr 320px;
      grid-template-rows: auto auto auto 1fr;
      min-height: 100vh;
      overflow: visible;
    }

    #header {
      grid-column: 1 / -1;
      position: static;
    }

    #domain-bar {
      grid-column: 1 / -1;
    }

    #metric-indicator {
      grid-column: 1 / -1;
    }

    #main {
      grid-column: 1;
      grid-row: 4;
      padding: 16px;
      padding-bottom: 16px;
      overflow: auto;
    }

    /* Drawer becomes sidebar */
    #drawer {
      grid-column: 2;
      grid-row: 4;
      position: static;
      transform: none !important;
      max-height: none;
      border-radius: 0;
      box-shadow: none;
      border-left: 1px solid var(--border);
      overflow-y: auto;
    }

    #drawer-handle { display: none; }
    #drawer-overlay { display: none !important; }

    /* These are moved by JS on desktop, but keep them out of the grid */
    body > #detail-panel,
    body > #drawer-overlay {
      grid-column: 1 / -1;
      grid-row: -1;
    }

    #drawer-content {
      padding: 12px 16px 16px;
    }

    /* Detail panel inline in sidebar instead of fixed overlay */
    #detail-panel {
      position: static !important;
      bottom: auto !important;
      left: auto !important;
      right: auto !important;
      max-height: none !important;
      border-radius: 8px;
      box-shadow: none;
      margin: 12px 16px;
      animation: none !important;
    }

    #detail-panel.visible {
      display: block;
      animation: none;
    }

    /* Legend can be wider */
    #legend {
      max-width: 600px;
    }

    /* Metric chips can wrap more */
    .metric-chip {
      font-size: 13px;
      padding: 5px 10px;
    }

    .major-toggle {
      font-size: 12px;
      padding: 4px 10px;
    }

    .quick-btn {
      font-size: 13px;
      padding: 5px 12px;
    }

    .header-subtitle {
      font-size: 13px;
    }

    #detail-panel { display: block !important; }
  }
</style>
</head>
<body>

<!-- Header -->
<header id="header">
  <div class="header-dot dot-orange"></div>
  <div id="header-title">
    <h1>STEM Curriculum Explorer</h1>
    <p class="header-subtitle">Explore curricular overlap between STEM programs using the MIDFIELD dataset</p>
  </div>
  <button id="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">&#9790;</button>
</header>

<!-- Domain pills -->
<nav id="domain-bar">
  <button class="domain-pill" data-domain="interdisciplinary">Cross-Domain</button>
  <button class="domain-pill" data-domain="computing">Computing</button>
  <button class="domain-pill" data-domain="engineering">Engineering</button>
  <button class="domain-pill" data-domain="sciences">Sciences</button>
</nav>

<!-- Active metric indicator -->
<div id="metric-indicator">
  Showing: <span id="metric-indicator-name">Jaccard</span>
</div>

<!-- Main -->
<main id="main">
  <div id="loading"><div class="spinner"></div>Loading data…</div>

  <div id="heatmap-container" style="display:none;">
    <div id="heatmap-wrapper"></div>
  </div>

  <div id="legend" style="display:none;">
    <span>0%</span>
    <div id="legend-bar"></div>
    <span>100%</span>
  </div>
</main>

<!-- Detail panel -->
<div id="detail-panel" role="dialog" aria-modal="true" aria-label="Cell details">
  <div id="detail-empty">Tap a cell to compare two programs</div>
  <button id="detail-close" aria-label="Close details">&times;</button>
  <div id="detail-title"></div>
  <div id="detail-bars"></div>
  <div id="detail-classification"></div>
</div>

<!-- Drawer overlay -->
<div id="drawer-overlay"></div>

<!-- Bottom drawer (mobile) / Sidebar (desktop) -->
<div id="drawer">
  <div id="drawer-handle">
    <div id="drawer-handle-bar"></div>
    <div id="drawer-handle-label">Controls</div>
  </div>

  <!-- Detail panel gets moved here by JS on desktop -->
  <div id="detail-slot"></div>

  <div id="drawer-content">
    <div class="drawer-section-title">Metric</div>
    <div id="metric-chips"></div>

    <div class="drawer-section-title">Options</div>
    <div id="options-row" style="display:flex;gap:8px;flex-wrap:wrap;">
      <div id="palette-toggle" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
      <button id="dendro-btn" class="metric-chip">Dendrograms</button>
    </div>

    <div class="drawer-section-title">Majors</div>
    <div id="quick-select"></div>
    <div id="major-toggles"></div>
  </div>
</div>

  // Build 256-entry table by linearly interpolating between stops
  const lut = [];
  const n = stops.length - 1;
  for (let i = 0; i < 256; i++) {
    const t = i / 255 * n;
    const lo = Math.floor(t);
    const hi = Math.min(lo + 1, n);
    const f = t - lo;
    const r = Math.round(stops[lo][0] + f * (stops[hi][0] - stops[lo][0]));
    const g = Math.round(stops[lo][1] + f * (stops[hi][1] - stops[lo][1]));
    const b = Math.round(stops[lo][2] + f * (stops[hi][2] - stops[lo][2]));
    lut.push([r, g, b]);
  }
  return lut;
})();

// ─── Orange-Purple palette (white → orange → purple, Clemson-branded) ────────
const ORANGEPURPLE = (function() {
  // White → light orange → Clemson orange → deep orange → purple
  const stops = [
    [255,255,255],[255,250,240],[255,243,224],[255,236,208],[255,228,192],
    [255,220,176],[255,211,160],[255,202,144],[255,192,128],[255,182,112],
    [255,171,96],[255,160,80],[254,148,64],[252,136,48],[249,122,32],
    [245,108,16],[245,102,0],[238,94,0],[228,86,4],[218,78,10],
    [206,70,18],[194,62,28],[182,56,38],[170,50,48],[158,46,58],
    [146,42,66],[134,40,74],[122,38,82],[112,36,88],[102,34,96],
    [92,34,104],[82,45,128]
  ];
  const lut = [];
  const n = stops.length - 1;
  for (let i = 0; i < 256; i++) {
    const t = i / 255 * n;
    const lo = Math.floor(t);
    const hi = Math.min(lo + 1, n);
    const f = t - lo;
    const r = Math.round(stops[lo][0] + f * (stops[hi][0] - stops[lo][0]));
    const g = Math.round(stops[lo][1] + f * (stops[hi][1] - stops[lo][1]));
    const b = Math.round(stops[lo][2] + f * (stops[hi][2] - stops[lo][2]));
    lut.push([r, g, b]);
  }
  return lut;
})();

const PALETTES = {
  orangepurple: { name: 'Orange\u2013Purple', lut: ORANGEPURPLE,
    gradient: 'linear-gradient(to right, #fff, #ffb060, #F56600, #a03820, #522D80)' },
  viridis: { name: 'Viridis (colorblind)', lut: VIRIDIS,
    gradient: 'linear-gradient(to right, rgb(68,1,84), rgb(49,104,142), rgb(53,183,121), rgb(253,231,37))' }
};
let currentPalette = 'orangepurple';
let showDendrograms = false;

// Split a name into two lines at the space/slash closest to the middle
function twoLineHTML(name) {
  const spaces = [];
  for (let i = 0; i < name.length; i++) {
    if (name[i] === ' ' || name[i] === '/') spaces.push(i);
  }
  if (spaces.length > 0) {
    const mid = name.length / 2;
    const best = spaces.reduce((a, b) => Math.abs(a - mid) < Math.abs(b - mid) ? a : b);
    return name.substring(0, best) + '<br>' + name.substring(best + 1);
  }
  return name;
}

function cellColor(value) {
  const idx = Math.round(Math.min(Math.max(value, 0), 100) * 2.55);
  const [r, g, b] = PALETTES[currentPalette].lut[idx];
  return `rgb(${r},${g},${b})`;
}

// ─── Detail panel ─────────────────────────────────────────────────────────────
function classify(metrics, nameA, nameB, aIdx, bIdx) {
  const j = metrics.jaccard || 0;
  const t = metrics.tfidf || 0;
  const o = metrics.overlap || 0;
  if (j >= 30 && t >= 20) {
    return {
      label: 'Convergent',
      desc: 'These programs share substantial common coursework in both breadth and specialization.',
      note: 'Based on Jaccard \u2265 30 and TF-IDF Cosine \u2265 20.'
    };
  } else if (o > 50 && j < 30) {
    // Use course counts to determine nesting direction
    const data = state.data[state.domain];
    const counts = data.course_counts;
    const cipA = state.labels[aIdx].cip;
    const cipB = state.labels[bIdx].cip;
    const countA = counts ? (counts[cipA] || 0) : 0;
    const countB = counts ? (counts[cipB] || 0) : 0;
    let desc;
    if (countA && countB && countA !== countB) {
      const smaller = countA < countB ? nameA : nameB;
      const larger = countA < countB ? nameB : nameA;
      desc = `${smaller}\u2019s coursework appears largely within ${larger}\u2019s broader curriculum (${Math.min(countA,countB).toLocaleString()} vs ${Math.max(countA,countB).toLocaleString()} unique courses).`;
    } else {
      desc = 'These programs have a subset relationship\u2014one program\u2019s coursework appears largely within the other\u2019s.';
    }
    return {
      label: 'Nested',
      desc: desc,
      note: 'Based on Overlap > 50 and Jaccard < 30. Direction inferred from course catalog sizes.'
    };
  } else if (j >= 20 && j <= 50 && t < 20) {
    return {
      label: 'Parallel',
      desc: 'These programs share a common curricular base but diverge in their specialized content.',
      note: 'Based on Jaccard 20\u201350 and TF-IDF Cosine < 20.'
    };
  } else {
    return {
      label: 'Weak / Distinct',
      desc: 'These programs have limited curricular overlap and serve largely distinct learning objectives.',
      note: 'Low similarity values across all metrics.'
    };
  }
}

function showDetail(row, col) {
  const data = state.data[state.domain];
  if (!data) return;

  // Deselect previously selected cell
  document.querySelectorAll('.hm-cell.selected').forEach(el => el.classList.remove('selected'));

  // Mark new selected cell
  const cellEl = document.querySelector(`.hm-cell[data-row="${row}"][data-col="${col}"]`);
  if (cellEl) cellEl.classList.add('selected');

  state.selectedCell = { row, col };

  const displayOrder = state.displayOrder || state.activeMajors;
  const aIdx = displayOrder[row];
  const bIdx = displayOrder[col];
  const aName = state.labels[aIdx].name;
  const bName = state.labels[bIdx].name;

  $detailTitle.textContent = `${aName} ↔ ${bName}`;

  // Build metric values
  const metricValues = {};
  for (const key of METRIC_KEYS) {
    const matrix = data.matrices[key];
    if (matrix) {
      metricValues[key] = matrix[aIdx][bIdx];
    } else {
      metricValues[key] = 0;
    }
  }

  // Bars
  $detailBars.innerHTML = '';
  for (const key of METRIC_KEYS) {
    const val = metricValues[key];
    const isActive = key === state.metric;
    const row_el = document.createElement('div');
    row_el.className = 'metric-bar-row';
    row_el.innerHTML = `
      <div class="metric-bar-label">${METRIC_NAMES[key]}</div>
      <div class="metric-bar-track">
        <div class="metric-bar-fill${isActive ? ' highlighted' : ''}" style="width:${val.toFixed(1)}%"></div>
      </div>
      <div class="metric-bar-value">${val.toFixed(1)}%</div>
    `;
    $detailBars.appendChild(row_el);
  }

  // Classification
  if (aIdx === bIdx) {
    $detailClassification.innerHTML = `
      <div class="class-label">Same Program</div>
      <div class="class-desc">This is a self-comparison — all metrics are 100%.</div>
    `;
  } else {
    const cls = classify(metricValues, aName, bName, aIdx, bIdx);
    $detailClassification.innerHTML = `
      <div class="class-label">${cls.label}</div>
      <div class="class-desc">${cls.desc}</div>
      <div class="class-note">${cls.note}</div>
    `;
  }

  document.getElementById('detail-empty').style.display = 'none';
  $detailClose.style.display = '';
  $detailPanel.classList.add('visible');
  // If drawer is expanded, collapse it so panel is visible
  if (drawerExpanded) setDrawer(false);
}

function hideDetail() {
  $detailPanel.classList.remove('visible');
  document.querySelectorAll('.hm-cell.selected').forEach(el => el.classList.remove('selected'));
  state.selectedCell = null;
  if (isDesktop()) {
    document.getElementById('detail-empty').style.display = 'block';
    $detailClose.style.display = 'none';
    $detailPanel.classList.add('visible');
  }
}

function setupDetail() {
  $detailClose.addEventListener('click', hideDetail);
  // Move detail panel into sidebar on desktop, back to body on mobile
  const detailSlot = document.getElementById('detail-slot');
  function positionDetailPanel() {
    if (isDesktop()) {
      detailSlot.appendChild($detailPanel);
      // Show empty state on desktop when no cell selected
      if (!state.selectedCell) {
        document.getElementById('detail-empty').style.display = 'block';
        $detailClose.style.display = 'none';
        $detailPanel.classList.add('visible');
      }
    } else if ($detailPanel.parentNode !== document.body) {
      // Move back before drawer-overlay
      document.body.insertBefore($detailPanel, $drawerOverlay);
      document.getElementById('detail-empty').style.display = 'none';
    }
  }
  positionDetailPanel();
  window.addEventListener('resize', positionDetailPanel);
}

// ─── Heatmap rendering ────────────────────────────────────────────────────────
function renderHeatmap() {
  const data = state.data[state.domain];
  if (!data) return;

  let active = [...state.activeMajors];
  const n = active.length;
  if (n < 2) return;

  // Always reorder by dendrogram leaf order (clustering groups similar programs)
  const dendro = data.dendrogram;
  if (dendro) {
    const leafOrder = dendro.leaf_order;
    const activeSet = new Set(active);
    active = leafOrder.filter(i => activeSet.has(i));
  }

  // Store display order so showDetail can look up correct indices
  state.displayOrder = active;

  const matrix = data.matrices[state.metric];

  // Determine sizing
  const containerWidth = ($heatmapContainer.clientWidth || window.innerWidth) - 16;
  // Use wider labels on wider screens, narrower on phones
  const labelWidth = Math.min(220, Math.max(100, Math.floor(containerWidth * 0.25)));
  const available = containerWidth - labelWidth - (n - 1) * 2;
  const cellSize = Math.min(50, Math.max(16, Math.floor(available / n)));

  // Font size based on count
  let fontSize;
  if (n > 15) fontSize = '10px';
  else if (n > 10) fontSize = '11px';
  else fontSize = '13px';

  // Vertical rotated labels, 2 lines — height based on half the longest label
  const colLabelHeight = n > 15 ? 80 : 110;

  // Build grid: (n+1) cols × (n+1) rows
  // col 0: row labels (width=labelWidth), cols 1..n: cells (width=cellSize)
  // row 0: col labels (height=colLabelHeight), rows 1..n: data rows

  const gridCols = `${labelWidth}px ${Array(n).fill(`${cellSize}px`).join(' ')}`;
  const gridRows = `minmax(${colLabelHeight}px, auto) ${Array(n).fill(`minmax(${cellSize}px, auto)`).join(' ')}`;

  $heatmapWrapper.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'hm-grid';
  grid.style.gridTemplateColumns = gridCols;
  grid.style.gridTemplateRows = gridRows;

  // Corner cell
  const corner = document.createElement('div');
  corner.className = 'hm-corner';
  grid.appendChild(corner);

  // Column labels (row 0, cols 1..n)
  for (let c = 0; c < n; c++) {
    const idx = active[c];
    const label = document.createElement('div');
    label.className = 'hm-col-label';
    label.style.fontSize = fontSize;
    const name = state.labels[idx].name;
    label.title = name;
    label.innerHTML = twoLineHTML(name);
    grid.appendChild(label);
  }

  // Data rows
  for (let r = 0; r < n; r++) {
    const rIdx = active[r];

    // Row label
    const rowLabel = document.createElement('div');
    rowLabel.className = 'hm-row-label';
    rowLabel.style.fontSize = fontSize;
    rowLabel.title = state.labels[rIdx].name;
    rowLabel.innerHTML = twoLineHTML(state.labels[rIdx].name);
    grid.appendChild(rowLabel);

    // Cells
    for (let c = 0; c < n; c++) {
      const cIdx = active[c];
      const value = matrix[rIdx][cIdx];
      const cell = document.createElement('div');
      cell.className = 'hm-cell';
      cell.style.width = cellSize + 'px';
      cell.style.height = cellSize + 'px';
      cell.style.backgroundColor = cellColor(value);
      cell.dataset.row = r;
      cell.dataset.col = c;
      cell.title = `${state.labels[rIdx].name} ↔ ${state.labels[cIdx].name}: ${value.toFixed(1)}%`;

      // Restore selected state if same cell
      if (state.selectedCell && state.selectedCell.row === r && state.selectedCell.col === c) {
        cell.classList.add('selected');
      }

      cell.addEventListener('click', () => showDetail(r, c));
      grid.appendChild(cell);
    }
  }

  $heatmapWrapper.appendChild(grid);

  // Render dendrograms if enabled
  if (showDendrograms && dendro && active.length === dendro.leaf_order.length) {
    const dendroWidth = 60;
    const gap = 2; // matches grid gap
    const totalGridH = active.length * (cellSize + gap) - gap;

    // Build mapping from full leaf positions to pixel positions
    // scipy dendrogram icoord uses positions 5, 15, 25... (10*i + 5)
    // We need to map those to our cell centers
    const leafCount = dendro.leaves.length;

    const maxD = Math.max(...dendro.dcoord.flat());
    const totalGridW = n * (cellSize + gap) - gap;

    // Right dendrogram (vertical, beside rows)
    const rightSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    rightSvg.style.width = dendroWidth + 'px';
    rightSvg.style.height = totalGridH + 'px';
    rightSvg.style.flexShrink = '0';

    for (let s = 0; s < dendro.icoord.length; s++) {
      const ix = dendro.icoord[s];
      const iy = dendro.dcoord[s];
      const points = [];
      for (let p = 0; p < 4; p++) {
        const y = (ix[p] - 5) / (10 * (leafCount - 1)) * (totalGridH - cellSize) + cellSize / 2;
        const x = (iy[p] / maxD) * (dendroWidth - 4);
        points.push(`${x.toFixed(1)},${y.toFixed(1)}`);
      }
      const polyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      polyline.setAttribute('points', points.join(' '));
      polyline.setAttribute('fill', 'none');
      polyline.setAttribute('stroke', 'var(--clemson-purple)');
      polyline.setAttribute('stroke-width', '1.5');
      rightSvg.appendChild(polyline);
    }

    // Bottom dendrogram (horizontal, below columns)
    const bottomSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    bottomSvg.style.width = totalGridW + 'px';
    bottomSvg.style.height = dendroWidth + 'px';
    bottomSvg.style.marginLeft = labelWidth + 'px';
    bottomSvg.style.display = 'block';

    for (let s = 0; s < dendro.icoord.length; s++) {
      const ix = dendro.icoord[s];
      const iy = dendro.dcoord[s];
      const points = [];
      for (let p = 0; p < 4; p++) {
        const x = (ix[p] - 5) / (10 * (leafCount - 1)) * (totalGridW - cellSize) + cellSize / 2;
        const y = (iy[p] / maxD) * (dendroWidth - 4);
        points.push(`${x.toFixed(1)},${y.toFixed(1)}`);
      }
      const polyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      polyline.setAttribute('points', points.join(' '));
      polyline.setAttribute('fill', 'none');
      polyline.setAttribute('stroke', 'var(--clemson-purple)');
      polyline.setAttribute('stroke-width', '1.5');
      bottomSvg.appendChild(polyline);
    }

    // Layout: grid + right dendro side by side, bottom dendro below
    // Offset right dendro to align with data rows (skip col label row)
    rightSvg.style.marginTop = (colLabelHeight + gap) + 'px';

    const row = document.createElement('div');
    row.style.display = 'flex';
    row.style.alignItems = 'flex-start';
    row.style.gap = '4px';
    $heatmapWrapper.innerHTML = '';
    row.appendChild(grid);
    row.appendChild(rightSvg);
    $heatmapWrapper.appendChild(row);
    $heatmapWrapper.appendChild(bottomSvg);
  }

  $heatmapContainer.style.display = 'block';
  $legend.style.display = 'flex';
}

// ─── Metric chips ─────────────────────────────────────────────────────────────
function renderPaletteToggle() {
  $paletteToggle.innerHTML = '';
  for (const key of Object.keys(PALETTES)) {
    const btn = document.createElement('button');
    btn.className = 'metric-chip' + (key === currentPalette ? ' active' : '');
    btn.textContent = PALETTES[key].name;
    btn.addEventListener('click', () => {
      currentPalette = key;
      $legendBar.style.background = PALETTES[key].gradient;
      renderPaletteToggle();
      renderHeatmap();
      updateHash();
    });
    $paletteToggle.appendChild(btn);
  }
}

function renderMetricChips() {
  $metricChips.innerHTML = '';
  for (const key of METRIC_KEYS) {
    const btn = document.createElement('button');
    btn.className = 'metric-chip' + (key === state.metric ? ' active' : '');
    btn.textContent = METRIC_NAMES[key];

      }

  }
}

// ─── Major toggles ────────────────────────────────────────────────────────────
function renderMajorToggles() {
  const n = state.labels.length;

  // Quick select buttons
  $quickSelect.innerHTML = '';

  function addQuickBtn(label, count) {
    const btn = document.createElement('button');
    btn.className = 'quick-btn';
    btn.textContent = label;
    btn.addEventListener('click', () => {
      state.activeMajors = Array.from({length: Math.min(count, n)}, (_, i) => i);
      state.selectedCell = null;
      hideDetail();
      renderMajorToggles();
      renderHeatmap();
      updateHash();
    });
    $quickSelect.appendChild(btn);
  }

  addQuickBtn('All', n);
  if (n > 15) addQuickBtn('Top 15', 15);
  if (n > 10) addQuickBtn('Top 10', 10);
  if (n > 5) addQuickBtn('Top 5', 5);

  // Custom number picker
  const customBtn = document.createElement('button');
  customBtn.className = 'quick-btn';
  customBtn.textContent = 'Top\u2026';
  customBtn.addEventListener('click', () => {
    const val = prompt(`Show top N majors (2\u2013${n}):`, String(Math.min(10, n)));
    if (val === null) return;
    const num = parseInt(val);
    if (isNaN(num) || num < 2 || num > n) return;
    state.activeMajors = Array.from({length: num}, (_, i) => i);
    state.selectedCell = null;
    hideDetail();
    renderMajorToggles();
    renderHeatmap();
    updateHash();
  });
  $quickSelect.appendChild(customBtn);

  // None button
  const noneBtn = document.createElement('button');
  noneBtn.className = 'quick-btn';
  noneBtn.textContent = 'None';
  noneBtn.addEventListener('click', () => {
    state.activeMajors = [0, 1];
    state.selectedCell = null;
    hideDetail();
    renderMajorToggles();
    renderHeatmap();
    updateHash();
  });
  $quickSelect.appendChild(noneBtn);

  // Toggle buttons
  $majorToggles.innerHTML = '';
  for (let i = 0; i < state.labels.length; i++) {
    const isActive = state.activeMajors.includes(i);
    const btn = document.createElement('button');
    btn.className = 'major-toggle' + (isActive ? ' active' : '');
    btn.textContent = state.labels[i].name;
    btn.dataset.idx = i;
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.idx);
      const pos = state.activeMajors.indexOf(idx);
      if (pos === -1) {
        state.activeMajors.push(idx);
        state.activeMajors.sort((a, b) => a - b);
      } else {
        if (state.activeMajors.length <= 2) return; // minimum 2
        state.activeMajors.splice(pos, 1);
      }
      state.selectedCell = null;
      hideDetail();
      renderMajorToggles();
      renderHeatmap();
      updateHash();
    });
    $majorToggles.appendChild(btn);
  }
}

// ─── Domain switching ─────────────────────────────────────────────────────────
async function switchDomain(domain, hashParams) {
  state.domain = domain;
  state.selectedCell = null;
  hideDetail();

  // Update pill styles
  $domainPills.forEach(p => p.classList.toggle('active', p.dataset.domain === domain));

  // Show loading if not cached
  if (!state.data[domain]) {
    $loading.innerHTML = '<div class="spinner"></div>Loading data\u2026';
    $loading.style.display = 'flex';
    $heatmapContainer.style.display = 'none';
    $legend.style.display = 'none';
    try {
      const res = await fetch(`data/${domain}.json`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      state.data[domain] = await res.json();
    } catch (err) {
      $loading.innerHTML = `Error loading ${domain} data. Tap a domain to retry.`;
      console.error(err);
      return;
    }
  }

  const data = state.data[domain];
  state.labels = Object.entries(data.labels).map(([cip, name]) => ({ cip, name }));
  state.activeMajors = state.labels.map((_, i) => i);

  // Apply hash params if provided
  if (hashParams) {
    if (hashParams.metric && METRIC_NAMES[hashParams.metric]) {
      state.metric = hashParams.metric;
    }
    if (hashParams.palette && PALETTES[hashParams.palette]) {
      currentPalette = hashParams.palette;
      $legendBar.style.background = PALETTES[currentPalette].gradient;
    }
    if (hashParams.dendro !== undefined) {
      showDendrograms = hashParams.dendro === '1';
      $dendroBtn.classList.toggle('active', showDendrograms);
    }
    if (hashParams.n) {
      const n = state.labels.length;
      if (hashParams.n === 'all') {
        state.activeMajors = state.labels.map((_, i) => i);
      } else {
        const count = parseInt(hashParams.n);
        if (!isNaN(count) && count >= 2 && count <= n) {
          state.activeMajors = Array.from({length: count}, (_, i) => i);
        }
      }
    }
  } else {
    // Auto top-10 on mobile for large domains
    if (!isDesktop() && state.labels.length > 10) {
      state.activeMajors = Array.from({length: 10}, (_, i) => i);
    }
  }

  $loading.style.display = 'none';
  $metricIndicatorName.textContent = METRIC_NAMES[state.metric];

  renderPaletteToggle();
  renderMetricChips();
  renderMajorToggles();
  renderHeatmap();
  updateHash();
}

// ─── URL hash state ───────────────────────────────────────────────────────────
function updateHash() {
  const n = state.activeMajors.length;
  const total = state.labels.length;
  const nParam = n === total ? 'all' : String(n);
  const params = [
    `domain=${state.domain}`,
    `metric=${state.metric}`,
    `n=${nParam}`,
    `palette=${currentPalette}`,
    `dendro=${showDendrograms ? 1 : 0}`
  ];
  history.replaceState(null, '', '#' + params.join('&'));
}

function loadFromHash() {
  const hash = location.hash.replace(/^#/, '');
  if (!hash) return null;
  const params = {};
  for (const part of hash.split('&')) {
    const [k, v] = part.split('=');
    if (k && v !== undefined) params[k] = v;
  }
  return params;
}

// ─── Domain pill listeners ────────────────────────────────────────────────────
$domainPills.forEach(pill => {
  pill.addEventListener('click', () => switchDomain(pill.dataset.domain, null));
});

// ─── Keyboard navigation ──────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (!state.selectedCell) return;
  const { row, col } = state.selectedCell;
  const n = state.activeMajors.length;
  let newRow = row, newCol = col;

  if (e.key === 'ArrowUp') newRow = Math.max(0, row - 1);
  else if (e.key === 'ArrowDown') newRow = Math.min(n - 1, row + 1);
  else if (e.key === 'ArrowLeft') newCol = Math.max(0, col - 1);
  else if (e.key === 'ArrowRight') newCol = Math.min(n - 1, col + 1);
  else if (e.key === 'Escape') { hideDetail(); renderHeatmap(); return; }
  else return;

  e.preventDefault();
  showDetail(newRow, newCol);
});

// ─── Re-render on resize ──────────────────────────────────────────────────────
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderHeatmap, 150);
});

// ─── Init ─────────────────────────────────────────────────────────────────────
setupThemeToggle();
setupDrawer();
setupDetail();
const _hashParams = loadFromHash();
const _initDomain = (_hashParams && _hashParams.domain && DOMAIN_NAMES[_hashParams.domain])
  ? _hashParams.domain
  : 'interdisciplinary';
switchDomain(_initDomain, _hashParams);
</script>
</body>
</html>
